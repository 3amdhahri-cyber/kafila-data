name: Sources probe
on:
  push:
    branches: [sources-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p audio && cd audio
          curl -sL -A "Mozilla/5.0" "https://qurancomplex.gov.sa/en/?p=3979" -o page.html || true
          grep -oE 'https?://[^"'"'"' ]+\.(mp3|zip)' page.html | sort -u | head -200 > links.txt || true
          grep -oE 'href="[^"]*(audio|sound|recit|quran)[^"]*"' page.html | sort -u | head -100 > hrefs.txt || true
          wc -c page.html; wc -l links.txt hrefs.txt
      - run: |
          git config user.name kafila-bot
          git config user.email kafila-bot@users.noreply.github.com
          git add audio
          git commit -qm "assets probe" && git push origin HEAD:sources-probe
