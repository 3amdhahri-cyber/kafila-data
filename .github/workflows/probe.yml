name: Sources probe
on:
  push:
    branches: [sources-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p audio
          for q in "k%C3%B6ln" "koln" "Euskirchen"; do
            echo "== $q" >> audio/photon.txt
            curl -s -o /tmp/p.json -w "%{http_code} %{time_total}\n" -A "Kafila prayer app" "https://photon.komoot.io/api/?q=$q&limit=7&lang=de&lat=50.661&lon=6.787" >> audio/photon.txt
            head -c 600 /tmp/p.json >> audio/photon.txt; echo >> audio/photon.txt
          done
          curl -sI -A "Kafila prayer app" "https://photon.komoot.io/api/?q=koln" | head -20 >> audio/photon.txt
          cat audio/photon.txt
      - run: |
          git config user.name kafila-bot
          git config user.email kafila-bot@users.noreply.github.com
          git add audio
          git commit -qm "assets probe" && git push origin HEAD:sources-probe
