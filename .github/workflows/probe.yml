name: Sources probe
on:
  push:
    branches: [sources-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd assets2
          curl -sL -o ne_110m_admin0.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson
          ls -la
      - run: |
          git config user.name kafila-bot
          git config user.email kafila-bot@users.noreply.github.com
          git add assets2
          git commit -qm "assets probe" && git push origin HEAD:sources-probe
