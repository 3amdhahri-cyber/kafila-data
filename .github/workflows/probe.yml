name: Sources probe
on:
  push:
    branches: [sources-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p audio
          for r in ar.alafasy ar.abdulbasitmurattal ar.husary ar.minshawi ar.mahermuaiqly ar.abdurrahmaansudais ar.saoodshuraym ar.hudhaify ar.muhammadayyoub ar.ahmedajamy; do
            for b in 192 128 64 48 32; do
              c=$(curl -s -o /dev/null -w "%{http_code}" -I "https://cdn.islamic.network/quran/audio/$b/$r/262.mp3")
              echo "$r $b $c" >> audio/bitrates.txt
            done
          done
          curl -sL "https://api.alquran.cloud/v1/edition/format/audio" -o audio/editions.json || true
          cat audio/bitrates.txt
      - run: |
          git config user.name kafila-bot
          git config user.email kafila-bot@users.noreply.github.com
          git add audio
          git commit -qm "assets probe" && git push origin HEAD:sources-probe
